name: Build ShareSave APK
on:
  push:
    branches: [sharesave-apk-build]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack ShareSave
        run: |
          python3 -m pip install --user brotli
          mkdir -p sharesave
          python3 - <<'PY'
          import base64,brotli,tarfile,io
          from pathlib import Path
          raw=base64.b64decode(Path("sharesave-source.br.b64").read_text())
          with tarfile.open(fileobj=io.BytesIO(brotli.decompress(raw))) as tar:
              tar.extractall("sharesave", filter="data")
          PY
      - run: gradle --no-daemon -p sharesave :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ShareSave-v0.3.0-debug-apk
          path: sharesave/app/build/outputs/apk/debug/app-debug.apk
