name: Build ShareSave Lite APK
on:
  push:
    branches: [sharesave-apk-build]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Build debug APK
        run: gradle --no-daemon -p sharesave-lite :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ShareSave-Lite-debug-apk
          path: sharesave-lite/app/build/outputs/apk/debug/app-debug.apk
